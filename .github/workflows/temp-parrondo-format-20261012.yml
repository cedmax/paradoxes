name: Temporary Parrondo format diff
on:
  pull_request:
    paths:
      - "src/components/illustrations/parrondos-paradox.astro"
      - ".github/workflows/temp-parrondo-format-20261012.yml"
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier changes
        run: |
          pnpm exec prettier --write src/components/illustrations/parrondos-paradox.astro
          git --no-pager diff -- src/components/illustrations/parrondos-paradox.astro
