name: Illustration format preview

on:
  pull_request:
    paths:
      - src/components/illustrations/prisoners-dilemma.astro
      - .github/workflows/illustration-format-preview.yml

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier src/components/illustrations/prisoners-dilemma.astro
