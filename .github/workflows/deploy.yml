name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    # PR previews are opt-in: apply the "deploy-preview" label.
    # Subsequent commits deploy again only while the label remains present.
    types: [labeled, synchronize, reopened]
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # Production: push to main or manual dispatch on main only.
    # PR: same-repo PR with the deploy-preview label, not any other new label.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'deploy-preview') &&
        (github.event.action != 'labeled' || github.event.label.name == 'deploy-preview'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Astro builds on the GitHub runner, not on Netlify.
      - run: pnpm build

      # Fork PRs are excluded by the job-level condition above.
      # Netlify only hosts the output: the build already happened, so --no-build.
      # Manual dispatch is only allowed from main, preventing an accidental
      # production deployment from a feature branch.
      - name: Deploy to Netlify
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.number }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            target=(--alias "deploy-preview-${PR_NUMBER}")
          else
            target=(--prod)
          fi
          pnpm exec netlify deploy --no-build --dir dist --json \
            --message "${EVENT_NAME} ${SHA}" "${target[@]}" > deploy.json
          cat deploy.json
          echo "url=$(jq -r '.deploy_url // empty' deploy.json)" >> "$GITHUB_OUTPUT"

  # Separate job so a transient comment failure doesn't force redeployment.
  comment:
    needs: deploy
    if: github.event_name == 'pull_request' && needs.deploy.outputs.url != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      # The aliased URL is stable across pushes, so comment once and skip if present.
      - name: Comment preview URL on PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.number }}
          URL: ${{ needs.deploy.outputs.url }}
        run: |
          existing=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq "[.[] | select(.body | contains(\"${URL}\"))] | length")
          if [ "$existing" = "0" ]; then
            gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              -f body="🚀 Deploy preview: ${URL}"
          fi
