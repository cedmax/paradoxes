name: CI

on:
  pull_request:
    # Draft PRs consume no CI runner minutes. Run checks when marked ready.
    # A conversion back to draft cancels superseded runs via concurrency.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Run all four checks even when one fails, with a single install and runner.
      - name: Lint
        id: lint
        run: pnpm lint
        continue-on-error: true

      - name: Astro check
        id: check
        run: pnpm check
        continue-on-error: true

      - name: Formatting
        id: format
        run: pnpm exec prettier --check .
        continue-on-error: true

      # Temporary branch verification; removed once the built HTML is checked.
      - name: Validate production build and no-JS explanation markup
        if: always()
        run: |
          pnpm build
          pnpm check:seo
          node -e 'const fs=require("node:fs"),path=require("node:path");function files(d){return fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>e.isDirectory()?files(path.join(d,e.name)):[path.join(d,e.name)])}const entries=files("dist").filter(f=>f.endsWith(".html"));const match=entries.find(f=>fs.readFileSync(f,"utf8").includes("data-entry=\"magic-octagon\""));if(!match)throw Error("Magic Octagon output not found");const html=fs.readFileSync(match,"utf8");const section=html.match(/<section[^>]+data-illusion-explanation[^>]*>/);if(!section)throw Error("Explanation marker not rendered");if(/\\shidden(?:[=\\s>])/.test(section[0]))throw Error("SSR explanation must not have hidden attribute");if(!html.includes("magic-octagon-interactive"))throw Error("Interactive gate script missing");if(!html.includes("The tempting up-left guess"))throw Error("Why text missing from SSR");console.log("GATE_BUILD_OK",match,section[0],"HTML_FILES",entries.length);'

      - name: Unused code
        id: knip
        run: pnpm knip
        continue-on-error: true

      - name: Report failed checks
        if: always()
        run: |
          if [[ "${{ steps.lint.outcome }}" != "success" ||
                "${{ steps.check.outcome }}" != "success" ||
                "${{ steps.format.outcome }}" != "success" ||
                "${{ steps.knip.outcome }}" != "success" ]]; then
            echo "One or more checks failed. Review the steps above." >&2
            exit 1
          fi
