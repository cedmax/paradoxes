name: CI

on:
  pull_request:
    # Draft PRs consume no CI runner minutes. Run checks when marked ready.
    # A conversion back to draft cancels superseded runs via concurrency.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Run all four checks even when one fails, with a single install and runner.
      - name: Lint
        id: lint
        run: pnpm lint
        continue-on-error: true

      - name: Astro check
        id: check
        run: pnpm check
        continue-on-error: true

      - name: Formatting
        id: format
        run: pnpm exec prettier --check .
        continue-on-error: true

      - name: Unused code
        id: knip
        run: pnpm knip
        continue-on-error: true

      # Temporary smoke test for this PR. Remove once it passes.
      - name: Smoke build PR 87
        if: github.event.pull_request.number == 87
        run: |
          pnpm build
          pnpm check:seo

      - name: Show checker proof formatting diff
        if: always()
        run: |
          pnpm exec prettier --write src/components/illusions/checker-shadow-illusion.astro
          git diff --no-ext-diff -- src/components/illusions/checker-shadow-illusion.astro

      - name: Report failed checks
        if: always()
        run: |
          if [[ "${{ steps.lint.outcome }}" != "success" ||
                "${{ steps.check.outcome }}" != "success" ||
                "${{ steps.format.outcome }}" != "success" ||
                "${{ steps.knip.outcome }}" != "success" ]]; then
            echo "One or more checks failed. Review the steps above." >&2
            exit 1
          fi
