name: CI

on:
  pull_request:
    # Draft PRs consume no CI runner minutes. Run checks when marked ready.
    # A conversion back to draft cancels superseded runs via concurrency.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Run all four checks even when one fails, with a single install and runner.
      - name: Lint
        id: lint
        run: pnpm lint
        continue-on-error: true

      - name: Astro check
        id: check
        run: pnpm check
        continue-on-error: true

      - name: Formatting
        id: format
        run: pnpm exec prettier --check .
        continue-on-error: true

      - name: Unused code
        id: knip
        run: pnpm knip
        continue-on-error: true

      # One-time check: compile published pages and all unverified preview illusions.
      - name: Smoke build PR 87
        if: github.event.pull_request.number == 87
        run: |
          pnpm build
          pnpm check:seo
          PREVIEW_UNVERIFIED=true SITE_INDEXING=noindex pnpm build
          SITE_INDEXING=noindex pnpm check:seo

      # Temporary capture of the project's canonical formatter output.
      - name: Show illusion formatting corrections
        if: always()
        run: |
          pnpm exec prettier --write src/components/illusions src/components/illustration-kit/IllusionControls.astro src/components/illustration-kit/MeasurementGuides.astro src/content/entries/zollner-illusion.md src/content/entries/lilac-chaser.md src/content/entries/hermann-grid-illusion.md src/content/entries/vertical-horizontal-illusion.md src/content/entries/hering-illusion.md src/content/entries/scintillating-grid-illusion.md src/content/entries/ehrenstein-illusion.md src/content/entries/whites-illusion.md src/content/entries/wundt-illusion.md src/data/palette.ts src/scripts/illustration.ts src/styles/global.css docs/architecture.md .claude/skills/build-illustration/SKILL.md
          git diff --no-ext-diff -- src/components/illusions src/components/illustration-kit/IllusionControls.astro src/components/illustration-kit/MeasurementGuides.astro src/content/entries/zollner-illusion.md src/content/entries/lilac-chaser.md src/content/entries/hermann-grid-illusion.md src/content/entries/vertical-horizontal-illusion.md src/content/entries/hering-illusion.md src/content/entries/scintillating-grid-illusion.md src/content/entries/ehrenstein-illusion.md src/content/entries/whites-illusion.md src/content/entries/wundt-illusion.md src/data/palette.ts src/scripts/illustration.ts src/styles/global.css docs/architecture.md .claude/skills/build-illustration/SKILL.md

      - name: Report failed checks
        if: always()
        run: |
          if [[ "${{ steps.lint.outcome }}" != "success" ||
                "${{ steps.check.outcome }}" != "success" ||
                "${{ steps.format.outcome }}" != "success" ||
                "${{ steps.knip.outcome }}" != "success" ]]; then
            echo "One or more checks failed. Review the steps above." >&2
            exit 1
          fi
