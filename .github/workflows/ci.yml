name: CI

on:
  workflow_call:
    inputs:
      upload_artifact:
        description: Upload the validated production output for deployment
        type: boolean
        default: false
  pull_request:
    # Draft PRs consume no CI runner minutes. Run checks when marked ready.
    # A conversion back to draft cancels superseded runs via concurrency.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Run independent checks even when one fails, with a single install and runner.
      - name: Lint
        id: lint
        run: pnpm lint
        continue-on-error: true

      - name: Astro check
        id: check
        run: pnpm check
        continue-on-error: true

      - name: Formatting
        id: format
        run: pnpm exec prettier --check .
        continue-on-error: true

      - name: Unused code
        id: knip
        run: pnpm knip
        continue-on-error: true

      - name: Regression tests
        id: test
        run: pnpm test
        continue-on-error: true

      - uses: actions/cache@v5
        with:
          path: node_modules/.cache/og
          key: og-${{ hashFiles('src/content/entries/**', 'src/og/**', 'src/data/title.ts', 'src/styles/global.css', 'pnpm-lock.yaml') }}
          restore-keys: og-

      # Validate production output on every ready PR, even without a deploy-preview label.
      - name: Production build
        id: build
        run: pnpm build
        env:
          SITE_INDEXING: index
          PREVIEW_UNVERIFIED: "false"
        continue-on-error: true

      - name: Generated SEO
        id: seo
        if: steps.build.outcome == 'success'
        run: pnpm check:seo
        env:
          SITE_INDEXING: index
        continue-on-error: true

      - name: Install test browser
        id: browser_setup
        if: steps.build.outcome == 'success'
        run: pnpm exec playwright install --with-deps chromium
        continue-on-error: true

      - name: Browser regressions
        id: browser
        if: steps.build.outcome == 'success' && steps.browser_setup.outcome == 'success'
        run: pnpm test:browser
        continue-on-error: true

      - name: Browser failure reports
        if: always() && steps.browser.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Report failed checks
        if: always()
        run: |
          if [[ "${{ steps.lint.outcome }}" != "success" ||
                "${{ steps.check.outcome }}" != "success" ||
                "${{ steps.format.outcome }}" != "success" ||
                "${{ steps.knip.outcome }}" != "success" ||
                "${{ steps.test.outcome }}" != "success" ||
                "${{ steps.build.outcome }}" != "success" ||
                "${{ steps.seo.outcome }}" != "success" ||
                "${{ steps.browser_setup.outcome }}" != "success" ||
                "${{ steps.browser.outcome }}" != "success" ]]; then
            echo "One or more checks failed. Review the steps above." >&2
            exit 1
          fi

      - name: Upload validated production site
        if: inputs.upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: validated-site-${{ github.sha }}
          path: dist/
          retention-days: 1
          if-no-files-found: error
