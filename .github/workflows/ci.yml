name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Run all four checks even when one fails, with a single install and runner.
      - name: Lint
        id: lint
        run: pnpm lint
        continue-on-error: true

      - name: Astro check
        id: check
        run: pnpm check
        continue-on-error: true

      - name: Formatting
        id: format
        run: pnpm exec prettier --check .
        continue-on-error: true

      - name: Unused code
        id: knip
        run: pnpm knip
        continue-on-error: true

      - name: Report failed checks
        if: always()
        run: |
          if [[ "${{ steps.lint.outcome }}" != "success" ||
                "${{ steps.check.outcome }}" != "success" ||
                "${{ steps.format.outcome }}" != "success" ||
                "${{ steps.knip.outcome }}" != "success" ]]; then
            echo "One or more checks failed. Review the steps above." >&2
            exit 1
          fi
