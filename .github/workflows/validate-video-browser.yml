name: Temporary browser validation

concurrency:
  group: video-browser-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - checks/browser

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          python -m pip install --quiet playwright
          python -m playwright install chromium --with-deps
      - name: Start preview and check responsive interactions
        run: |
          SITE_INDEXING=noindex PREVIEW_UNVERIFIED=true pnpm build
          python -m http.server 4321 --bind 127.0.0.1 --directory dist > /tmp/astro.log 2>&1 &
          ready=false
          for i in {1..15}; do
            if curl -sf http://127.0.0.1:4321/entries/ames-window-illusion/ >/dev/null; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then cat /tmp/astro.log; exit 1; fi
          python scripts/validate-video-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screens
          path: /tmp/video-screens
          if-no-files-found: ignore
