name: Temporary illustration format and lint
on:
  push:
    branches:
      - illustrations/clarity-audit-20261011
    paths:
      - .github/workflows/illustration-qa-temp.yml
permissions:
  contents: write
jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format changed illustration files
        run: |
          pnpm exec prettier --write \
            src/components/illustrations/allais-paradox.astro \
            src/components/illustrations/bertrands-chord-paradox.astro \
            src/components/illustrations/nontransitive-dice.astro \
            src/components/illustrations/simpsons-paradox.astro \
            src/components/illustrations/survivorship-bias.astro
          pnpm exec prettier --check \
            src/components/illustrations/allais-paradox.astro \
            src/components/illustrations/bertrands-chord-paradox.astro \
            src/components/illustrations/nontransitive-dice.astro \
            src/components/illustrations/simpsons-paradox.astro \
            src/components/illustrations/survivorship-bias.astro
      - name: Lint
        run: pnpm lint
      - name: Astro check
        run: pnpm check
      - name: Production build
        run: pnpm build
      - name: Push formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/illustrations/
          if ! git diff --cached --quiet; then
            git commit -m "Format PR 58 illustrations with Prettier"
            git push origin HEAD:illustrations/clarity-audit-20261011
          fi
