name: Temporary format PR 23
on:
  push:
    branches:
      - illustration/monty-hall-problem-20261010
    paths:
      - .github/workflows/temporary-format-pr-23.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed Astro files
        run: |
          pnpm exec prettier --write \
          'src/components/illustrations/100-prisoners-problem.astro' \
          'src/components/illustrations/allais-paradox.astro' \
          'src/components/illustrations/bertrands-chord-paradox.astro' \
          'src/components/illustrations/coin-rotation-paradox.astro' \
          'src/components/illustrations/ladder-paradox.astro' \
          'src/components/illustrations/monty-hall-problem.astro' \
          'src/components/illustrations/staircase-paradox.astro' \
          'src/components/illustrations/survivorship-bias.astro' \
          'src/pages/entries/[slug].astro' \
          'src/pages/index.astro'
      - name: Commit and push formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/components/illustrations/100-prisoners-problem.astro' 'src/components/illustrations/allais-paradox.astro' 'src/components/illustrations/bertrands-chord-paradox.astro' 'src/components/illustrations/coin-rotation-paradox.astro' 'src/components/illustrations/ladder-paradox.astro' 'src/components/illustrations/monty-hall-problem.astro' 'src/components/illustrations/staircase-paradox.astro' 'src/components/illustrations/survivorship-bias.astro' 'src/pages/entries/[slug].astro' 'src/pages/index.astro'
          if ! git diff --cached --quiet; then
            git commit -m "Format Astro 7 whitespace fixes with Prettier"
            git push origin HEAD:illustration/monty-hall-problem-20261010
          fi
