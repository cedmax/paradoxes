name: Temporary validation for video and illusion stack

on:
  push:
    branches:
      - video/validation-run

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Prettier and lint correction
        run: |
          sed -i 's/illusionSurface, series, stroke/illusionSurface, stroke/' src/components/illusions/kinetic-depth-effect.astro
          pnpm exec prettier --write .claude/skills/create-illusion/SKILL.md src/components/illusions src/components/illustration-kit/ClickToLoadVideo.astro
          git config user.name "Validation workflow"
          git config user.email "actions@users.noreply.github.com"
          git add .claude/skills/create-illusion/SKILL.md src/components/illusions src/components/illustration-kit/ClickToLoadVideo.astro
          if ! git diff --cached --quiet; then
            git commit -m "Format video and illusion changes"
            git push origin HEAD:video/validation-run
          fi
      - name: Lint
        run: pnpm lint
      - name: Astro and content check
        run: pnpm check
      - name: Formatting
        run: pnpm exec prettier --check .
      - name: Knip
        run: pnpm knip
      - name: Build
        run: pnpm build
      - name: SEO
        run: pnpm check:seo
