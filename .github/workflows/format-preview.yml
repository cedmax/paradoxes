name: Illustration format preview

on:
  pull_request:
    paths:
      - "src/components/illustrations/prosecutors-fallacy.astro"
      - ".github/workflows/format-preview.yml"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Show exact Prettier changes
        run: |
          pnpm exec prettier --write src/components/illustrations/prosecutors-fallacy.astro
          git --no-pager diff -- src/components/illustrations/prosecutors-fallacy.astro
