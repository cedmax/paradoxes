name: Temporary format PR 21
on:
  push:
    branches:
      - illustration/ladder-paradox-20261010
    paths:
      - .github/workflows/temporary-format-pr-21.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format the changed illustration
        run: pnpm exec prettier --write src/components/illustrations/ladder-paradox.astro
      - name: Commit and push formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/illustrations/ladder-paradox.astro
          if ! git diff --cached --quiet; then
            git commit -m "Format illustration using Prettier"
            git push origin HEAD:illustration/ladder-paradox-20261010
          fi
