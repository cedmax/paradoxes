name: Format illustration drafts once

on:
  push:
    branches: [chore/one-off-format-illustrations]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format each isolated draft branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while read -r branch slug; do
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
            pnpm exec prettier --write "src/components/illustrations/$slug.astro"
            if ! git diff --quiet; then
              git add "src/components/illustrations/$slug.astro"
              git commit -m "Format $slug illustration"
              git push origin "HEAD:refs/heads/$branch"
            fi
            echo "::group::Astro check $branch"
            pnpm check
            echo "::endgroup::"
          done <<'BRANCHES'
          illustration/bertrands-box-gold-draws bertrands-box-paradox
          illustration/discursive-dilemma-majorities discursive-dilemma
          illustration/class-size-weighted-average class-size-paradox
          illustration/boy-girl-how-you-learn boy-or-girl-paradox
          illustration/friendship-network-bias friendship-paradox
          illustration/lighthouse-spreading-beam lighthouse-paradox
          illustration/teletransporter-identity-copy parfits-teletransporter
          illustration/elevator-arrival-intervals elevator-paradox
          illustration/archers-paradox-bending archers-paradox
          illustration/bells-spaceships-string bells-spaceship-paradox
          illustration/ross-littlewood-numbered-balls ross-littlewood-paradox
          BRANCHES
